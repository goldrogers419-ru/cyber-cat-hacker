<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Cat Hacker // Terminal v0.1</title>
    <style>
        body {
            background-color: #0d0d15;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            text-shadow: 0 0 10px #00ffcc;
            margin-bottom: 5px;
            text-align: center;
        }
        .stats {
            display: flex;
            gap: 20px;
            background: #1a1a2e;
            padding: 15px 25px;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        .slot-machine {
            display: flex;
            gap: 15px;
            background: #16213e;
            padding: 25px;
            border: 2px solid #ff007f;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
            margin-bottom: 25px;
        }
        .reel {
            width: 70px;
            height: 70px;
            background: #0f3460;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }
        button {
            background-color: #ff007f;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff007f;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        button:disabled {
            background-color: #555;
            box-shadow: none;
            cursor: not-allowed;
        }
        #log {
            margin-top: 25px;
            min-height: 24px;
            color: #ffea00;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🐱 CYBER-CAT HACKER</h1>
    <p style="color: #888; margin-top: 0;">SYSTEM TERMINAL v0.1</p>

    <div class="stats">
        <div>⚡ Energy: <span id="spins">20</span></div>
        <div>🪙 Credits: <span id="coins">0</span></div>
        <div>🛡️ Firewalls: <span id="shields">0</span>/3</div>
    </div>

    <div class="slot-machine">
        <div class="reel" id="reel1">🐱</div>
        <div class="reel" id="reel2">🐱</div>
        <div class="reel" id="reel3">🐱</div>
    </div>

    <button id="spinBtn" onclick="spin()">[ HACK STARTEN ]</button>

    <div id="log">Bereit für Systemzugriff...</div>

    <script>
        let spins = 20;
        let coins = 0;
        let shields = 0;

        // Symbole: Münzen, Hack-Angriff, Firewall-Schild, Katze (Jackpot)
        const symbols = ['🪙', '💻', '🛡️', '🐱'];

        function updateUI() {
            document.getElementById('spins').innerText = spins;
            document.getElementById('coins').innerText = coins;
            document.getElementById('shields').innerText = shields;
            if (spins <= 0) {
                document.getElementById('spinBtn').disabled = true;
            }
        }

        function spin() {
            if (spins <= 0) return;

            spins--;
            const r1 = symbols[Math.floor(Math.random() * symbols.length)];
            const r2 = symbols[Math.floor(Math.random() * symbols.length)];
            const r3 = symbols[Math.floor(Math.random() * symbols.length)];

            document.getElementById('reel1').innerText = r1;
            document.getElementById('reel2').innerText = r2;
            document.getElementById('reel3').innerText = r3;

            checkWin(r1, r2, r3);
            updateUI();
        }

        function checkWin(r1, r2, r3) {
            const log = document.getElementById('log');

            if (r1 === r2 && r2 === r3) {
                if (r1 === '🪙') {
                    coins += 500;
                    log.innerText = "💰 DATEN-TREFFER! +500 Krypto-Credits!";
                } else if (r1 === '💻') {
                    coins += 1000;
                    log.innerText = "👾 SERVER GEHACKT! +1.000 Credits erbeutet!";
                } else if (r1 === '🛡️') {
                    if (shields < 3) {
                        shields++;
                        log.innerText = "🛡️ FIREWALL AKTIVIERT! (+1 Schutz)";
                    } else {
                        coins += 200;
                        log.innerText = "🛡️ Firewalls voll! Umgewandelt in +200 Credits.";
                    }
                } else if (r1 === '🐱') {
                    coins += 2500;
                    spins += 5;
                    log.innerText = "👑 CYBER-CAT JACKPOT! +2.500 Credits & +5 Energy!";
                }
            } else if (r1 === '🪙' || r2 === '🪙' || r3 === '🪙') {
                coins += 50;
                log.innerText = "Kleiner Datenfund: +50 Credits.";
            } else {
                log.innerText = "Zugriff verweigert. Erneut versuchen...";
            }
        }
    </script>
</body>
</html>
