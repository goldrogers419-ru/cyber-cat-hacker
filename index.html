<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Cat Hacker // Terminal v0.8</title>
    <style>
        body {
            background-color: #0d0d15;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }
        .sound-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #1a1a2e;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.2);
        }
        h1 {
            text-shadow: 0 0 10px #00ffcc;
            margin-bottom: 5px;
            margin-top: 25px;
            text-align: center;
        }
        .city-badge {
            background: linear-gradient(90deg, #ff007f, #7f00ff);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 15px;
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
        }
        .stats {
            display: flex;
            gap: 15px;
            background: #1a1a2e;
            padding: 12px 20px;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            font-size: 0.9rem;
        }
        .regen-info {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 18px;
            height: 16px;
        }
        .slot-machine {
            display: flex;
            gap: 12px;
            background: #16213e;
            padding: 20px;
            border: 2px solid #ff007f;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
            margin-bottom: 20px;
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .slot-machine.win-flash {
            border-color: #00ffcc;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.9);
        }
        .reel {
            width: 60px;
            height: 60px;
            background: #0f3460;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            transition: transform 0.1s;
        }
        .reel.spinning {
            border-color: #ffea00;
            transform: scale(0.94);
            filter: blur(1px);
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button.action-btn {
            background-color: #ff007f;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff007f;
            transition: transform 0.1s;
        }
        button.action-btn.raid {
            background-color: #7f00ff;
            box-shadow: 0 0 15px #7f00ff;
        }
        button.action-btn:active {
            transform: scale(0.95);
        }
        button.action-btn:disabled {
            background-color: #555;
            box-shadow: none;
            cursor: not-allowed;
        }
        #log {
            min-height: 24px;
            color: #ffea00;
            text-align: center;
            font-weight: bold;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .base-container {
            width: 100%;
            max-width: 400px;
            background: #121222;
            border: 1px solid #00ffcc;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .base-container h2 {
            font-size: 1.1rem;
            margin-top: 0;
            text-align: center;
            color: #ff007f;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.4);
        }
        .building {
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .building-info span {
            display: block;
        }
        .building-name {
            font-weight: bold;
            color: #00ffcc;
        }
        .building-lvl {
            font-size: 0.8rem;
            color: #888;
        }
        button.upgrade-btn {
            background-color: #00ffcc;
            color: #0d0d15;
            border: none;
            padding: 8px 12px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.85rem;
            border-radius: 5px;
            cursor: pointer;
        }
        button.upgrade-btn:disabled {
            background-color: #333;
            color: #777;
            cursor: not-allowed;
        }
        button.next-city-btn {
            width: 100%;
            background: linear-gradient(90deg, #00ffcc, #00b8ff);
            color: #0d0d15;
            border: none;
            padding: 12px;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            display: none;
        }
        .collection-container {
            width: 100%;
            max-width: 400px;
            background: #121222;
            border: 1px solid #7f00ff;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(127, 0, 255, 0.15);
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .collection-container h2 {
            font-size: 1.1rem;
            margin-top: 0;
            text-align: center;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }
