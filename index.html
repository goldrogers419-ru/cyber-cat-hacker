<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Cat Hacker // Terminal v0.5</title>
    <style>
        body {
            background-color: #0d0d15;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            text-shadow: 0 0 10px #00ffcc;
            margin-bottom: 5px;
            text-align: center;
        }
        .city-badge {
            background: linear-gradient(90deg, #ff007f, #7f00ff);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 15px;
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
        }
        .stats {
            display: flex;
            gap: 15px;
            background: #1a1a2e;
            padding: 12px 20px;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            font-size: 0.9rem;
        }
        .regen-info {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 18px;
            height: 16px;
        }
        .slot-machine {
            display: flex;
            gap: 12px;
            background: #16213e;
            padding: 20px;
            border: 2px solid #ff007f;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
            margin-bottom: 20px;
        }
        .reel {
            width: 60px;
            height: 60px;
            background: #0f3460;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button.action-btn {
            background-color: #ff007f;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff007f;
            transition: transform 0.1s;
        }
        button.action-btn.raid {
            background-color: #7f00ff;
            box-shadow: 0 0 15px #7f00ff;
        }
        button.action-btn:active {
            transform: scale(0.95);
        }
        button.action-btn:disabled {
            background-color: #555;
            box-shadow: none;
            cursor: not-allowed;
        }
        #log {
            min-height: 24px;
            color: #ffea00;
            text-align: center;
            font-weight: bold;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .base-container {
            width: 100%;
            max-width: 400px;
            background: #121222;
            border: 1px solid #00ffcc;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
            margin-bottom: 20px;
        }
        .base-container h2 {
            font-size: 1.1rem;
            margin-top: 0;
            text-align: center;
            color: #ff007f;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.4);
        }
        .building {
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .building-info span {
            display: block;
        }
        .building-name {
            font-weight: bold;
            color: #00ffcc;
        }
        .building-lvl {
            font-size: 0.8rem;
            color: #888;
        }
        button.upgrade-btn {
            background-color: #00ffcc;
            color: #0d0d15;
            border: none;
            padding: 8px 12px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.85rem;
            border-radius: 5px;
            cursor: pointer;
        }
        button.upgrade-btn:disabled {
            background-color: #333;
            color: #777;
            cursor: not-allowed;
        }
        button.next-city-btn {
            width: 100%;
            background: linear-gradient(90deg, #00ffcc, #00b8ff);
            color: #0d0d15;
            border: none;
            padding: 12px;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            display: none;
        }
        .reset-btn {
            background: none;
            border: 1px solid #444;
            color: #666;
            padding: 5px 10px;
            font-family: inherit;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🐱 CYBER-CAT HACKER</h1>
    <div class="city-badge" id="cityBadge">LVL 1: NEON-SLUMS</div>

    <div class="stats">
        <div>⚡ Energie: <span id="spins">25</span>/25</div>
        <div>🪙 Credits: <span id="coins">200</span></div>
        <div>🛡️ Firewalls: <span id="shields">0</span>/3</div>
    </div>
    <div class="regen-info" id="regenTimer">Energie-Speicher voll</div>

    <div class="slot-machine">
        <div class="reel" id="reel1">🐱</div>
        <div class="reel" id="reel2">🐱</div>
        <div class="reel" id="reel3">🐱</div>
    </div>

    <div class="action-buttons">
        <button class="action-btn" id="spinBtn" onclick="spin()">[ HACK STARTEN ]</button>
        <button class="action-btn raid" id="raidBtn" onclick="raidServer()" disabled>[ 🌐 SERVER RAID ]</button>
    </div>

    <div id="log">System bereit. Baue alle Module auf MAX aus!</div>

    <!-- Hacker-Basis / Upgrade-System -->
    <div class="base-container">
        <h2>⚡ HACKER-BASIS (UPGRADES)</h2>
        
        <div class="building">
            <div class="building-info">
                <span class="building-name" id="b1-name">💻 Mainframe-Server</span>
                <span class="building-lvl" id="b1-lvl">Stufe: 0 / 3</span>
            </div>
            <button class="upgrade-btn" id="b1-btn" onclick="upgradeBuilding(1)">300 🪙</button>
        </div>

        <div class="building">
            <div class="building-info">
                <span class="building-name" id="b2-name">📡 Quanten-Antenne</span>
                <span class="building-lvl" id="b2-lvl">Stufe: 0 / 3</span>
            </div>
            <button class="upgrade-btn" id="b2-btn" onclick="upgradeBuilding(2)">500 🪙</button>
        </div>

        <div class="building">
            <div class="building-info">
                <span class="building-name" id="b3-name">🛡️ Firewall-Kern</span>
                <span class="building-lvl" id="b3-lvl">Stufe: 0 / 3</span>
            </div>
            <button class="upgrade-btn" id="b3-btn" onclick="upgradeBuilding(3)">800 🪙</button>
        </div>

        <button class="next-city-btn" id="nextCityBtn" onclick="advanceCity()">🚀 NÄCHSTES VERSTECK HACKEN (+15 ⚡)</button>
    </div>

    <button class="reset-btn" onclick="resetGame()">[ Speicherstand zurücksetzen ]</button>

    <script>

        // Städte / Level-Definitionen
        const cities = [

            { name: "LVL 2: CYBER-BUNKER", b1: "🖥️ Krypton-Cluster", b2: "🛰️ Subraum-Relais", b3: "⚡ Plasma-Schild", baseCost: 700, mult: 1.8 },
            { name: "LVL 3: DARKNET-ZITADELLE", b1: "🧠 KI-Rechenkern", b2: "🔭 Quanten-Scanner", b3: "🔒 Eis-Matrix", baseCost: 1600, mult: 3.2 },

            { name: "LVL 5: ORBITAL-STATION", b1: "👑 Omega-Core", b2: "🛸 Sternen-Link", b3: "🛡️ Ägis-System", baseCost: 8000, mult: 12 }
        ];

        let gameState = {
            cityIndex: 0,
            spins: 25,
            coins: 200,
            shields: 0,
            raidCharges: 0,
            buildings: {
                1: { level: 0, maxLevel: 3, cost: 300 },
                2: { level: 0, maxLevel: 3, cost: 500 },
                3: { level: 0, maxLevel: 3, cost: 800 }
            }
        };

        let secondsLeft = REGEN_SECONDS;
        const symbols = ['🪙', '💻', '🛡️', '🐱', '🌐'];

        function loadGame() {
            const saved = localStorage.getItem('cyberCatSaveV5');
            if (saved) {
                gameState = JSON.parse(saved);
            }
        }

        function saveGame() {
            localStorage.setItem('cyberCatSaveV5', JSON.stringify(gameState));
        }

        function resetGame() {
            if (confirm("Wirklich den kompletten Fortschritt löschen?")) {
                localStorage.removeItem('cyberCatSaveV5');
                location.reload();
            }
        }

        function updateUI() {
            const currentCity = cities[gameState.cityIndex];
            document.getElementById('cityBadge').innerText = currentCity.name;
            document.getElementById('spins').innerText = gameState.spins;
            document.getElementById('coins').innerText = gameState.coins;
            document.getElementById('shields').innerText = gameState.shields;

            document.getElementById('b1-name').innerText = currentCity.b1;
            document.getElementById('b2-name').innerText = currentCity.b2;
            document.getElementById('b3-name').innerText = currentCity.b3;

            document.getElementById('spinBtn').disabled = gameState.spins <= 0;
